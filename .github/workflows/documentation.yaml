name: Documentation
on:
  push:
    branches: [ "main" ]

permissions:
  id-token: write
  pages: write
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: iffy/install-nim@v5
      - name: Generate documentation
        id: build
        run: nimble docgen
      - name: Upload documentation
        id: deployment
        uses: actions/upload-pages-artifact@v3
        with:
         path: docs/ 
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: deployment
        id: deployment
        uses: actions/deploy-pages@v4
