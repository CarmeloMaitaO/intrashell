# This file is automatically generated from Nix configuration. Do not edit directly.

jobs:
  tag:
    name: Run all tags
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: "0"
      - id: run
        name: Run the Tag script
        run: |
          version=$(<version)
          git config user.name "Git Bot"
          git config user.email "carmeloaugustomaitaorlando@gmail.com"
          git checkout main
          git pull
          git fetch --all
          git merge development
          git push
          git tag $version
          git push --tags
        with:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
name: Tag
"on":
  push:
    branches:
      - development
    paths:
      - version
  workflow_run:
    workflows:
      - Test
permissions:
  contents: write
