# This file is automatically generated from Nix configuration. Do not edit directly.

jobs:
  doc:
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    name: Document & deploy
    needs:
      - tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      - id: build
        name: Generate documentation
        run: nix run .#docgen
      - id: deployment
        name: Upload documentation
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/
      - name: deployment
        uses: actions/deploy-pages@v4
  tag:
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    name: Merge into main and tag the commit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: "0"
      - uses: cachix/install-nix-action@v31
      - id: run
        name: Run the Tag script
        run: |
          git config user.name "Carmelo Augusto Maita Orlando"
          git config user.email "98987672+CarmeloMaitaO@users.noreply.github.com"
          git checkout dev
          git pull
          nix run .#tag
          version=$(<version)
          echo "THE VERSION IN DEV IS:" $version
          git checkout main
          git pull
          git merge origin/dev
          git push
          git tag $version
          git push --tags
name: Tag & Document
"on":
  workflow_run:
    branches:
      - dev
    types:
      - completed
    workflows:
      - test
permissions:
  contents: write
  id-token: write
  pages: write
